    v1_B11: v1_experiments/baselines/B11_d2d3_xgb/predictions.jsonl
    v1_B12: v1_experiments/ablation/b11b12_20260529_230823/B12_D1_only_xgb_final/predictions.jsonl
    # v1.0 main-table baselines (seed 42 only; same thread-disjoint split), for the revised main table
