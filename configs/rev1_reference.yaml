# Revision-1 reference rebuild: leakage fixes and protocol changes, one at a time.
# Version: v1 | Date: 2026-10-22

source_run_id: run_20260526_123858
output_prefix: rev1_reference

features:
  d1_v2_relpath: lmeic_features_v2/d1_features_v2.jsonl
  d2d3_v2_relpath: lmeic_features_v2/d2d3_features_v2.parquet
  d2d3_v3_path: private/runs/rev1_features_d2d3_v3_20261022_190835/d2d3_features_v3.parquet
  context_rich_dir: private/runs/rev1_context_rich_20261022_232836   # E7 (d2x_*, d3x_*)

# v1.0 artefacts used for the reproduction check and for reusing test-time co-reader scores.
v1_artefacts:
  v1_config: v1_experiments/lmeic/LMEIC_v9_d1v2/config.json
  plm_probs: v1_experiments/_models/plm_probs.parquet

seeds: [42, 123, 456, 789, 2026]
n_folds: 5
optuna_trials: 60
inner_es_fraction: 0.1

# Protocols:
#   v1_original  : StratifiedKFold over messages; LightGBM early stopping on the scored fold.
#   grouped_clean: StratifiedGroupKFold over threads; LightGBM early stopping on an inner
#                  thread-disjoint split of the training fold.
coreader:
  model_name: xlm-roberta-base
  max_len: 256
  batch_size: 16
  lr: 2.0e-5
  epochs: 4
  seed: 42

# E10 co-reader robustness: every candidate uses the same thread-grouped folds (fold seed 42)
# for development-pool scores and a model fitted on the full development pool for test scores.
coreader_bank:
  fold_seed: 42
  common: {max_len: 256, epochs: 4, bf16: true}
  candidates:
    xlmr_base:       {model_name: xlm-roberta-base, lr: 2.0e-5, batch_size: 16, seeds: [42, 123, 456, 789, 2026]}
    xlmr_large:      {model_name: FacebookAI/xlm-roberta-large, lr: 1.0e-5, batch_size: 16, seeds: [42]}
    mdeberta_v3_base: {model_name: microsoft/mdeberta-v3-base, lr: 2.0e-5, batch_size: 16, seeds: [42]}
    bge_m3:          {model_name: BAAI/bge-m3, lr: 1.0e-5, batch_size: 16, seeds: [42]}
    chinese_roberta: {model_name: hfl/chinese-roberta-wwm-ext, lr: 2.0e-5, batch_size: 16, seeds: [42]}
    # E21 (2026-10-28): headline recipe (fp32), five seeds; full-pool model also scores the external sets
    xlmr_base_fp32:  {model_name: xlm-roberta-base, lr: 2.0e-5, batch_size: 16, bf16: false, seeds: [42, 123, 456, 789, 2026]}

# Each variant changes one factor relative to the previous row.
external_sets:                       # instances outside EMAIL-3R scored by models fitted on train+val
  d1_dir: private/runs/rev1_d1_gpt4o_20241120_20261022_192314
  d2d3_dir: private/runs/rev1_newset_features_d2d3_v3_20261022_194045
  agent_dir: private/runs/rev1_agent_labels_20261022_192927
  sets:
    cross_role: private/runs/rev1_eval_sets_pii06c_20261022_193808/cross_role_instances.jsonl.gz
    fresh_holdout: private/runs/rev1_eval_sets_pii06c_20261022_193808/fresh_holdout_instances.jsonl.gz
    e1b: private/runs/rev1_e1b_manager_20261022_194017/e1b_instances.jsonl.gz

analysis:
