variants:
  - name: R0_v2_original_storedparams
    d2d3: v2
    protocol: v1_original
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: stacking
    reuse_v1_params: true
  - name: R1_v3_original
    d2d3: v3
    protocol: v1_original
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: stacking
  - name: R2_v3_grouped_explicit
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: stacking
  - name: R3_v3_grouped_full
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond, coreader]
    arch: stacking
  - name: R4_B11_v3_grouped
    d2d3: v3
    protocol: grouped_clean
    groups: [d2, d3]
    arch: xgb
  # B12 (D1-only XGBoost) under the grouped protocol: the v1.0 fair rerun dropped the D1
  # field role_relevance through the role-conditional prefix filter (19 instead of 20 columns).
  - name: R5_B12_grouped
    d2d3: v3
    protocol: grouped_clean
    groups: [d1]
    arch: xgb
  # E4: open-weight local extractors replace GPT-4o descriptors for all 15K instances
  # (same prompt and schema, JSON-schema-constrained decoding). Run with --only E4_.
  - name: E4_qwen3_8b_explicit_R2params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_d1_local_qwen3_8b_20261022_221637/d1_all.jsonl
    params_from: R2_v3_grouped_explicit
  - name: E4_qwen3_8b_full_R3params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond, coreader]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_d1_local_qwen3_8b_20261022_221637/d1_all.jsonl
    params_from: R3_v3_grouped_full
  - name: E4_qwen3_8b_explicit_tuned
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_d1_local_qwen3_8b_20261022_221637/d1_all.jsonl
  - name: E4_qwen25_7b_explicit_R2params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_d1_local_qwen25_7b_20261022_225518/d1_all.jsonl
    params_from: R2_v3_grouped_explicit
  - name: E4_qwen25_7b_full_R3params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond, coreader]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_d1_local_qwen25_7b_20261022_225518/d1_all.jsonl
    params_from: R3_v3_grouped_full
  # E6: Qwen3-8B descriptors extracted from strongly masked text (rev1_privacy_mask).
  - name: E6_qwen3_masked_explicit_R2params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_d1_local_qwen3_8b_masked_20261023_004930/d1_all.jsonl
    params_from: R2_v3_grouped_explicit
  - name: E6_qwen3_masked_full_R3params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond, coreader]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_d1_local_qwen3_8b_masked_20261023_004930/d1_all.jsonl
    params_from: R3_v3_grouped_full
  # E13: descriptors from the XLM-R student distilled from the GPT-4o extractor (development
  # rows: out-of-fold student predictions; test rows: student fitted on the development pool).
  - name: E13_distilled_explicit_R2params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_e13_distill_20261023_002435/d1_all.jsonl
    params_from: R2_v3_grouped_explicit
  - name: E13_distilled_full_R3params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond, coreader]
    arch: stacking
    d1_file: datasets/email3r_runs/rev1_e13_distill_20261023_002435/d1_all.jsonl
    params_from: R3_v3_grouped_full
  # E9: domain ablation under the grouped protocol with the reference parameters held fixed
  # (same convention as the v1.0 domain ablation). Interactions that involve a removed
  # domain disappear with it; no_context also drops the role-conditional products, so no
  # recipient information remains. Run with --only E9_.
  - name: E9_explicit_minus_d2
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d3, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_minus_d3
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_minus_d2d3
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_no_context
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, text, interactions]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_full_no_context
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, text, interactions, coreader]
    arch: stacking
    params_from: R3_v3_grouped_full
  - name: E9_full_minus_d2d3
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, text, interactions, role_cond, coreader]
    arch: stacking
    params_from: R3_v3_grouped_full
  - name: E9_full_minus_d2
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d3, text, interactions, role_cond, coreader]
    arch: stacking
    params_from: R3_v3_grouped_full
  - name: E9_full_minus_d3
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, text, interactions, role_cond, coreader]
    arch: stacking
    params_from: R3_v3_grouped_full
  - name: E9_explicit_minus_d1
    d2d3: v3
    protocol: grouped_clean
    groups: [d2, d3, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  # Component ablations for the revised ablation table (2026-10-27): R2 parameters, grouped protocol
  - name: E9_explicit_minus_text
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_minus_interactions
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_xgb_only
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions, role_cond]
    arch: xgb
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_minus_rolecond
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, text, interactions]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_d1_only
    d2d3: v3
    protocol: grouped_clean
    groups: [d1]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_d2_only
    d2d3: v3
    protocol: grouped_clean
    groups: [d2]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E9_explicit_d3_only
    d2d3: v3
    protocol: grouped_clean
    groups: [d3]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  # E7: richer pre-t context (d2x: history, graph, thread semantics, label prior; d3x: role
  # statement similarity, mined role n-grams) and the D2 metadata/history split. Run with --only E7_.
  - name: E7_explicit_rich_R2params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, d2x, d3x, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E7_explicit_rich_noprior_R2params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, d2x_noprior, d3x, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E7_explicit_plus_d2x_R2params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, d2x, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E7_explicit_plus_d3x_R2params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, d3x, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E7_explicit_d2meta
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2meta, d3, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E7_explicit_d2hist
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2hist, d3, text, interactions, role_cond]
    arch: stacking
    params_from: R2_v3_grouped_explicit
  - name: E7_context_rich_xgb
    d2d3: v3
    protocol: grouped_clean
    groups: [d2, d3, d2x, d3x]
    arch: xgb
    params_from: R4_B11_v3_grouped
  - name: E7_full_rich_R3params
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, d2x, d3x, text, interactions, role_cond, coreader]
    arch: stacking
    params_from: R3_v3_grouped_full
  - name: E7_explicit_rich_tuned
    d2d3: v3
    protocol: grouped_clean
    groups: [d1, d2, d3, d2x, d3x, text, interactions, role_cond]
