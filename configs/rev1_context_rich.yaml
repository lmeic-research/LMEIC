# E7: richer, strictly pre-timestamp context features (revision 1).
# Version: v1 | Date: 2026-10-22
# Mailbox filing folders (important / todo / etc.) are never read; role owners are the
# most frequent To address of each role mailbox, and owner messages are recognised by
# sender address in any mailbox.

source_run_id: run_20260526_123858
history_relpath: phase0_preprocessing/05_redacted/with_threads.jsonl.gz
sampled_relpath: phase0_preprocessing/06_sampled/sampled_all.jsonl.gz
output_prefix: rev1_context_rich

external_sets:
  cross_role: datasets/email3r_runs/rev1_eval_sets_pii06c_20261022_193808/cross_role_instances.jsonl.gz
  fresh_holdout: datasets/email3r_runs/rev1_eval_sets_pii06c_20261022_193808/fresh_holdout_instances.jsonl.gz
  e1b: datasets/email3r_runs/rev1_e1b_manager_20261022_194017/e1b_instances.jsonl.gz

history:
  load_windows_hours: [24, 168]
  owner_window_days: 90
  gap_cap_days: 365

graph:
  n_components: 8
  pagerank_iters: 30
  pagerank_damping: 0.85

label_prior:                  # smoothed target encoding over earlier development-pool labels
  smoothing: 10
  levels: [sender_role, sender, domain, role]

semantic:
  model_name: BAAI/bge-m3
  max_len: 512
  batch_size: 64
  thread_history_max: 5
  role_description_source: email3r/code/annotation/prompts/system_prompts.py

mined_ngrams:                 # cross-fitted on thread-grouped development folds
  fold_seed: 42
  n_folds: 5
  ngram_range: [1, 2]
  min_df: 5
  top_k: 300
  alpha: 1.0
